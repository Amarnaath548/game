<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Magica Royale - Phase 1 Prototype</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0e15;
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: none;
    }
    #game-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    /* HUD Overlay */
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    #top-bar {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18, 20, 32, 0.85);
      border: 1px solid #2e3452;
      color: #e2e8f0;
      padding: 8px 20px;
      border-radius: 999px;
      font-size: 13px;
      letter-spacing: 0.5px;
    }
    /* Touch Zones */
    .touch-zone {
      position: absolute;
      bottom: 0;
      width: 50%;
      height: 65%;
      pointer-events: auto;
    }
    #left-zone { left: 0; }
    #right-zone { right: 0; }

    /* Floating Joysticks */
    .joystick-base {
      position: absolute;
      width: 110px;
      height: 110px;
      margin-left: -55px;
      margin-top: -55px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.07);
      border: 2px solid rgba(255, 255, 255, 0.25);
      display: none;
      pointer-events: none;
    }
    .joystick-knob {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 46px;
      height: 46px;
      margin-left: -23px;
      margin-top: -23px;
      border-radius: 50%;
      background: rgba(0, 242, 255, 0.65);
      box-shadow: 0 0 14px rgba(0, 242, 255, 0.8);
    }
    #right-base .joystick-knob {
      background: rgba(255, 85, 0, 0.75);
      box-shadow: 0 0 14px rgba(255, 85, 0, 0.8);
    }
    /* Dash Button */
    #dash-btn {
      position: absolute;
      bottom: 36px;
      right: 170px;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(183, 0, 255, 0.25);
      border: 2px solid #b700ff;
      color: #ffffff;
      font-weight: 700;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(183, 0, 255, 0.4);
    }
    #dash-btn:active {
      transform: scale(0.92);
      background: rgba(183, 0, 255, 0.55);
    }
  </style>
</head>
<body>
  <div id="hud">
    <div id="top-bar">WASD + Mouse Aim | Space: Dash | Touch: Dual Joysticks</div>
    <div id="left-zone" class="touch-zone"></div>
    <div id="right-zone" class="touch-zone"></div>

    <div id="left-base" class="joystick-base">
      <div id="left-knob" class="joystick-knob"></div>
    </div>
    <div id="right-base" class="joystick-base">
      <div id="right-knob" class="joystick-knob"></div>
    </div>

    <div id="dash-btn">DASH</div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
