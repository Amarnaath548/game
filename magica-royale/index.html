<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Magica Royale - 2.5D Battle Royale</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0e15;
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: none;
    }
    #game-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    /* HUD Overlay */
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    /* Top Bar Status */
    #top-bar {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(18, 20, 32, 0.88);
      border: 1px solid #2e3452;
      padding: 6px 18px;
      border-radius: 999px;
      color: #e2e8f0;
      font-size: 13px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
    }
    .badge-alive { color: #39ff14; }
    .badge-zone { color: #b700ff; }

    /* Player Health & XP Bar */
    #player-status {
      position: absolute;
      top: 56px;
      left: 50%;
      transform: translateX(-50%);
      width: 260px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      pointer-events: none;
    }
    .bar-container {
      width: 100%;
      height: 10px;
      background: rgba(15, 17, 26, 0.85);
      border: 1px solid #2e3452;
      border-radius: 6px;
      overflow: hidden;
    }
    #hp-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #10b981, #059669);
      transition: width 0.15s ease-out;
    }
    #xp-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #00f2ff, #0284c7);
      transition: width 0.15s ease-out;
    }
    .status-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      color: #cbd5e1;
      padding: 0 2px;
    }

    /* Spell Selector buttons */
    #spell-bar {
      position: absolute;
      top: 14px;
      left: 16px;
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }
    .spell-btn {
      padding: 6px 12px;
      border-radius: 8px;
      background: rgba(18, 20, 32, 0.85);
      border: 1px solid #3b4262;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .spell-btn.active {
      color: #ffffff;
      border-color: #00f2ff;
      background: rgba(0, 242, 255, 0.2);
      box-shadow: 0 0 10px rgba(0, 242, 255, 0.4);
    }

    /* Touch Zones */
    .touch-zone {
      position: absolute;
      bottom: 0;
      width: 50%;
      height: 65%;
      pointer-events: auto;
    }
    #left-zone { left: 0; }
    #right-zone { right: 0; }

    /* Floating Joysticks */
    .joystick-base {
      position: absolute;
      width: 110px;
      height: 110px;
      margin-left: -55px;
      margin-top: -55px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.07);
      border: 2px solid rgba(255, 255, 255, 0.25);
      display: none;
      pointer-events: none;
    }
    .joystick-knob {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 46px;
      height: 46px;
      margin-left: -23px;
      margin-top: -23px;
      border-radius: 50%;
      background: rgba(0, 242, 255, 0.65);
      box-shadow: 0 0 14px rgba(0, 242, 255, 0.8);
    }
    #right-base .joystick-knob {
      background: rgba(255, 85, 0, 0.75);
      box-shadow: 0 0 14px rgba(255, 85, 0, 0.8);
    }

    /* Dash Button */
    #dash-btn {
      position: absolute;
      bottom: 36px;
      right: 170px;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(183, 0, 255, 0.25);
      border: 2px solid #b700ff;
      color: #ffffff;
      font-weight: 700;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(183, 0, 255, 0.4);
    }
    #dash-btn:active {
      transform: scale(0.92);
      background: rgba(183, 0, 255, 0.55);
    }

    /* Upgrade Cards Overlay (Non-pausing) */
    #perk-overlay {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      gap: 12px;
      pointer-events: auto;
      z-index: 20;
    }
    .perk-card {
      width: 140px;
      background: rgba(17, 24, 39, 0.94);
      border: 2px solid #3b82f6;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      color: #ffffff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      transition: transform 0.15s, border-color 0.15s;
    }
    .perk-card:hover {
      transform: translateY(-4px);
      border-color: #60a5fa;
    }
    .perk-title {
      font-weight: 700;
      font-size: 13px;
      color: #38bdf8;
      margin-bottom: 4px;
    }
    .perk-desc {
      font-size: 10px;
      color: #cbd5e1;
      line-height: 1.3;
    }

    /* Game Over / Victory Modal */
    #end-modal {
      position: absolute;
      inset: 0;
      background: rgba(5, 7, 12, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      z-index: 30;
      color: #ffffff;
    }
    #end-title {
      font-size: 38px;
      font-weight: 900;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    #end-subtitle {
      font-size: 16px;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    #restart-btn {
      padding: 12px 32px;
      border-radius: 999px;
      background: #3b82f6;
      border: none;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.6);
    }
  </style>
</head>
<body>
  <div id="hud">
    <div id="spell-bar">
      <button class="spell-btn active" data-spell="PYRO">Pyro (1)</button>
      <button class="spell-btn" data-spell="CRYO">Cryo (2)</button>
      <button class="spell-btn" data-spell="ELECTRO">Electro (3)</button>
      <button class="spell-btn" data-spell="VENOM">Venom (4)</button>
    </div>

    <div id="top-bar">
      <div class="badge badge-alive">ALIVE: <span id="alive-count">12</span></div>
      <div class="badge badge-zone">ZONE: <span id="zone-status">Safe</span></div>
    </div>

    <div id="player-status">
      <div class="status-labels">
        <span id="player-lvl-text">Lv 1 Pyromancer</span>
        <span id="player-hp-text">300 / 300</span>
      </div>
      <div class="bar-container">
        <div id="hp-fill"></div>
      </div>
      <div class="bar-container" style="height: 6px;">
        <div id="xp-fill"></div>
      </div>
    </div>

    <div id="perk-overlay"></div>

    <div id="left-zone" class="touch-zone"></div>
    <div id="right-zone" class="touch-zone"></div>

    <div id="left-base" class="joystick-base">
      <div id="left-knob" class="joystick-knob"></div>
    </div>
    <div id="right-base" class="joystick-base">
      <div id="right-knob" class="joystick-knob"></div>
    </div>

    <div id="dash-btn">DASH</div>
  </div>

  <div id="end-modal">
    <div id="end-title">VICTORY ROYALE</div>
    <div id="end-subtitle">You are the last Archmage standing!</div>
    <button id="restart-btn" onclick="window.location.reload()">Play Again</button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
