<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Magica Royale - 2.5D Battle Royale</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0e15;
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: none;
    }
    #game-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    /* ---------------- PRE-MATCH LOBBY SCREEN ---------------- */
    #lobby-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #1b1d2e 0%, #0a0b12 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 32px;
      z-index: 50;
      color: #ffffff;
      box-sizing: border-box;
    }

    .lobby-header {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .game-logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, #00f2ff, #b700ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .currency-display {
      display: flex;
      gap: 16px;
    }
    .cur-pill {
      background: rgba(18, 20, 32, 0.85);
      border: 1px solid #3b4262;
      padding: 6px 16px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .trophy-val { color: #fbbf24; }
    .gold-val { color: #facc15; }

    /* Armory & Upgrade Columns */
    .lobby-main {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin: 16px 0;
      flex-grow: 1;
      max-height: calc(100vh - 160px);
      overflow-y: auto;
    }
    @media (max-width: 768px) {
      .lobby-main {
        grid-template-columns: 1fr;
        max-height: calc(100vh - 180px);
      }
    }

    .panel-card {
      background: rgba(15, 17, 26, 0.85);
      border: 1px solid #2e3452;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .panel-title {
      font-size: 14px;
      font-weight: 800;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .staves-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .staff-card {
      background: rgba(24, 28, 44, 0.7);
      border: 2px solid #333a56;
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.2s;
    }
    .staff-card:hover {
      border-color: #60a5fa;
      transform: translateY(-2px);
    }
    .staff-card.selected {
      border-color: #00f2ff;
      background: rgba(0, 242, 255, 0.12);
      box-shadow: 0 0 12px rgba(0, 242, 255, 0.3);
    }
    .staff-name {
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 4px;
    }
    .staff-desc {
      font-size: 10px;
      color: #94a3b8;
      line-height: 1.3;
      flex-grow: 1;
      margin-bottom: 8px;
    }
    .staff-action-btn {
      width: 100%;
      padding: 5px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }
    .btn-select { background: #3b82f6; color: white; }
    .btn-unlock { background: #f59e0b; color: white; }
    .btn-equipped { background: #10b981; color: white; }

    /* Upgrade Rows */
    .upgrade-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .upgrade-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(24, 28, 44, 0.7);
      border: 1px solid #333a56;
      border-radius: 8px;
      padding: 8px 12px;
    }
    .upg-info {
      display: flex;
      flex-direction: column;
    }
    .upg-name {
      font-size: 12px;
      font-weight: 700;
    }
    .upg-desc {
      font-size: 10px;
      color: #94a3b8;
    }
    .upg-btn {
      padding: 6px 12px;
      border-radius: 6px;
      background: #f59e0b;
      border: none;
      color: white;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .upg-btn:disabled {
      background: #475569;
      cursor: not-allowed;
    }

    /* Lobby Bottom Controls */
    .lobby-footer {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .rank-info {
      display: flex;
      flex-direction: column;
    }
    .rank-label {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 700;
    }
    .rank-title {
      font-size: 16px;
      font-weight: 900;
    }
    #play-match-btn {
      padding: 14px 48px;
      font-size: 18px;
      font-weight: 900;
      color: #ffffff;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 0 24px rgba(37, 99, 235, 0.6);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    #play-match-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 32px rgba(37, 99, 235, 0.9);
    }
    #play-match-btn:active {
      transform: scale(0.96);
    }

    /* ---------------- IN-GAME HUD ---------------- */
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      display: none;
    }
    #top-bar {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(18, 20, 32, 0.88);
      border: 1px solid #2e3452;
      padding: 6px 18px;
      border-radius: 999px;
      color: #e2e8f0;
      font-size: 13px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
    }
    .badge-alive { color: #39ff14; }
    .badge-zone { color: #b700ff; }

    #player-status {
      position: absolute;
      top: 56px;
      left: 50%;
      transform: translateX(-50%);
      width: 260px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      pointer-events: none;
    }
    .bar-container {
      width: 100%;
      height: 10px;
      background: rgba(15, 17, 26, 0.85);
      border: 1px solid #2e3452;
      border-radius: 6px;
      overflow: hidden;
    }
    #hp-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #10b981, #059669);
      transition: width 0.15s ease-out;
    }
    #xp-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #00f2ff, #0284c7);
      transition: width 0.15s ease-out;
    }
    .status-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      color: #cbd5e1;
      padding: 0 2px;
    }

    #spell-bar {
      position: absolute;
      top: 14px;
      left: 16px;
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }
    .spell-btn {
      padding: 6px 12px;
      border-radius: 8px;
      background: rgba(18, 20, 32, 0.85);
      border: 1px solid #3b4262;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .spell-btn.active {
      color: #ffffff;
      border-color: #00f2ff;
      background: rgba(0, 242, 255, 0.2);
      box-shadow: 0 0 10px rgba(0, 242, 255, 0.4);
    }

    .touch-zone {
      position: absolute;
      bottom: 0;
      width: 50%;
      height: 65%;
      pointer-events: auto;
    }
    #left-zone { left: 0; }
    #right-zone { right: 0; }

    .joystick-base {
      position: absolute;
      width: 110px;
      height: 110px;
      margin-left: -55px;
      margin-top: -55px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.07);
      border: 2px solid rgba(255, 255, 255, 0.25);
      display: none;
      pointer-events: none;
    }
    .joystick-knob {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 46px;
      height: 46px;
      margin-left: -23px;
      margin-top: -23px;
      border-radius: 50%;
      background: rgba(0, 242, 255, 0.65);
      box-shadow: 0 0 14px rgba(0, 242, 255, 0.8);
    }
    #right-base .joystick-knob {
      background: rgba(255, 85, 0, 0.75);
      box-shadow: 0 0 14px rgba(255, 85, 0, 0.8);
    }

    #dash-btn {
      position: absolute;
      bottom: 36px;
      right: 170px;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(183, 0, 255, 0.25);
      border: 2px solid #b700ff;
      color: #ffffff;
      font-weight: 700;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(183, 0, 255, 0.4);
    }
    #dash-btn:active {
      transform: scale(0.92);
      background: rgba(183, 0, 255, 0.55);
    }

    #perk-overlay {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      gap: 12px;
      pointer-events: auto;
      z-index: 20;
    }
    .perk-card {
      width: 140px;
      background: rgba(17, 24, 39, 0.94);
      border: 2px solid #3b82f6;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      color: #ffffff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      transition: transform 0.15s, border-color 0.15s;
    }
    .perk-card:hover {
      transform: translateY(-4px);
      border-color: #60a5fa;
    }
    .perk-title {
      font-weight: 700;
      font-size: 13px;
      color: #38bdf8;
      margin-bottom: 4px;
    }
    .perk-desc {
      font-size: 10px;
      color: #cbd5e1;
      line-height: 1.3;
    }

    /* ---------------- MATCH END MODAL ---------------- */
    #end-modal {
      position: absolute;
      inset: 0;
      background: rgba(5, 7, 12, 0.88);
      backdrop-filter: blur(8px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      z-index: 60;
      color: #ffffff;
      gap: 12px;
    }
    #end-title {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 1px;
    }
    #end-subtitle {
      font-size: 16px;
      color: #94a3b8;
    }
    .match-rewards-box {
      display: flex;
      gap: 20px;
      margin: 12px 0;
    }
    .reward-pill {
      background: rgba(18, 20, 32, 0.8);
      border: 1px solid #3b4262;
      padding: 8px 18px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 15px;
    }
    .modal-actions {
      display: flex;
      gap: 14px;
      margin-top: 8px;
    }
    .modal-btn {
      padding: 12px 28px;
      border-radius: 999px;
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .modal-btn:hover { transform: scale(1.05); }
    #modal-lobby-btn { background: #334155; color: white; }
    #modal-play-again-btn { background: #2563eb; color: white; box-shadow: 0 0 16px rgba(37, 99, 235, 0.5); }
  </style>
</head>
<body>
  <!-- LOBBY SCREEN -->
  <div id="lobby-screen">
    <div class="lobby-header">
      <div class="game-logo">MAGICA ROYALE</div>
      <div class="currency-display">
        <div class="cur-pill">🏆 <span id="lobby-trophies" class="trophy-val">0</span> Trophies</div>
        <div class="cur-pill">🪙 <span id="lobby-gold" class="gold-val">100</span> Gold</div>
      </div>
    </div>

    <div class="lobby-main">
      <!-- Armory Column -->
      <div class="panel-card">
        <div class="panel-title">Staff Armory</div>
        <div id="staves-container" class="staves-grid"></div>
      </div>

      <!-- Upgrades Column -->
      <div class="panel-card">
        <div class="panel-title">Archmage Meta Upgrades</div>
        <div id="upgrades-container" class="upgrade-list"></div>
      </div>
    </div>

    <div class="lobby-footer">
      <div class="rank-info">
        <span class="rank-label">CURRENT RANK</span>
        <span id="lobby-rank-title" class="rank-title" style="color: #94a3b8;">Apprentice Mage</span>
      </div>
      <button id="play-match-btn">ENTER ARENA</button>
    </div>
  </div>

  <!-- IN-GAME HUD -->
  <div id="hud">
    <div id="spell-bar">
      <button class="spell-btn active" data-spell="PYRO">Pyro (1)</button>
      <button class="spell-btn" data-spell="CRYO">Cryo (2)</button>
      <button class="spell-btn" data-spell="ELECTRO">Electro (3)</button>
      <button class="spell-btn" data-spell="VENOM">Venom (4)</button>
    </div>

    <div id="top-bar">
      <div class="badge badge-alive">ALIVE: <span id="alive-count">12</span></div>
      <div class="badge badge-zone">ZONE: <span id="zone-status">Safe</span></div>
    </div>

    <div id="player-status">
      <div class="status-labels">
        <span id="player-lvl-text">Lv 1 Pyromancer</span>
        <span id="player-hp-text">300 / 300</span>
      </div>
      <div class="bar-container">
        <div id="hp-fill"></div>
      </div>
      <div class="bar-container" style="height: 6px;">
        <div id="xp-fill"></div>
      </div>
    </div>

    <div id="perk-overlay"></div>

    <div id="left-zone" class="touch-zone"></div>
    <div id="right-zone" class="touch-zone"></div>

    <div id="left-base" class="joystick-base">
      <div id="left-knob" class="joystick-knob"></div>
    </div>
    <div id="right-base" class="joystick-base">
      <div id="right-knob" class="joystick-knob"></div>
    </div>

    <div id="dash-btn">DASH</div>
  </div>

  <!-- MATCH END MODAL -->
  <div id="end-modal">
    <div id="end-title">#1 VICTORY ROYALE</div>
    <div id="end-subtitle">You are the last Archmage standing!</div>

    <div class="match-rewards-box">
      <div id="reward-trophy" class="reward-pill trophy-val">+30 Trophies</div>
      <div id="reward-gold" class="reward-pill gold-val">+150 Gold</div>
    </div>

    <div class="modal-actions">
      <button id="modal-lobby-btn" class="modal-btn">Return to Lobby</button>
      <button id="modal-play-again-btn" class="modal-btn">Play Again</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
