<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Divyastra – map preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; font-family: system-ui, sans-serif; }
  #ui { position: fixed; top: 12px; left: 12px; display: flex; gap: 8px; z-index: 2; }
  #ui button { padding: 8px 14px; border: 0; border-radius: 8px; background: #263041; color: #fff; font-weight: 600; cursor: pointer; }
  #ui button.on { background: #3b82f6; }
  #hint { position: fixed; bottom: 10px; left: 12px; color: #fff9; font-size: 12px; z-index: 2; }
</style>
</head>
<body>
<div id="ui"></div>
<div id="hint">drag = orbit · wheel = zoom · right-drag = pan · keys 1-4 switch maps (grass · desert · autumn · snow)</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { createMap, MAP_IDS } from '/src/maps/index.js';

const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const hemi = new THREE.HemisphereLight(0xFFFBEB, 0x3D6B24, 0.7);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xFFF4D2, 1.45);
sun.position.set(40, 65, 30); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -75, right: 75, top: 75, bottom: -75, near: 10, far: 160 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun);

const camera = new THREE.PerspectiveCamera(45, W / H, 0.5, 1000);
camera.position.set(0, 170, 120);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 8);
controls.update();

// Preview-only dressing: the game's storm cylinder + mythic chest
const storm = new THREE.Mesh(
  new THREE.CylinderGeometry(120, 120, 18, 64, 1, true),
  new THREE.MeshBasicMaterial({ color: 0x7C3AED, transparent: true, opacity: 0.14, side: THREE.DoubleSide, depthWrite: false })
);
storm.position.y = 9; scene.add(storm);
const chest = new THREE.Group();
const gold = new THREE.MeshLambertMaterial({ color: 0xF2B01E, emissive: 0x5A3D00, flatShading: true });
const body = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1, 1.6), gold); body.position.y = 0.9;
const lid = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 2.4, 10, 1, false, 0, Math.PI), gold);
lid.rotation.z = Math.PI / 2; lid.position.y = 1.4;
chest.add(body, lid); chest.position.set(0, 0, -12); scene.add(chest);

let current = null, currentId = null;
function show(id) {
  if (current) current.dispose();
  const bgs = { desert: 0xFAD98E, autumn: 0xE9D58A, snow: 0xBFE6FF, grass: 0x7ff5e4 };
  current = createMap(id, scene);
  current.applyLighting(hemi, sun);
  currentId = id;
  scene.background = new THREE.Color(current.sky ?? bgs[id] ?? 0x888888);
  document.querySelectorAll('#ui button').forEach((b) => b.classList.toggle('on', b.dataset.id === id));
}
const ui = document.getElementById('ui');
MAP_IDS.forEach((id, i) => {
  const b = document.createElement('button');
  b.textContent = `${i + 1}. ${id}`; b.dataset.id = id; b.onclick = () => show(id);
  ui.appendChild(b);
});
addEventListener('keydown', (e) => { const i = +e.key - 1; if (MAP_IDS[i]) show(MAP_IDS[i]); });

// hooks for automated screenshots
window.show = show;
window.view = (pos, look, fov = 45) => {
  camera.fov = fov; camera.updateProjectionMatrix();
  camera.position.set(...pos); controls.target.set(...look); controls.update();
  renderer.render(scene, camera);
};
window.ids = MAP_IDS;
window.stats = () => ({ children: scene.children.length, geometries: renderer.info.memory.geometries });
show(new URLSearchParams(location.search).get('map') || MAP_IDS[0]);

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
window.ready = true;
</script>
</body>
</html>
